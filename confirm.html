<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmation de Réservation - Laser Magic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/theme.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #101c38 0%, #04070f 75%);
      min-height: 100vh;
      color: var(--text-primary);
      font-family: var(--font-sans);
      padding: 0;
      margin: 0;
    }

    .portal-nav {
      background: rgba(8, 13, 26, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-logo {
      height: 36px;
      width: auto;
      filter: drop-shadow(0 0 8px var(--laser-cyan-glow));
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 0.72rem;
      color: var(--laser-cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .portal-container {
      max-width: 820px;
      margin: 36px auto;
      padding: 0 20px 80px 20px;
    }

    .status-banner {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid var(--border-medium);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      box-shadow: var(--shadow-lg);
    }

    .status-banner.confirmed {
      border-color: rgba(0, 255, 136, 0.4);
      background: linear-gradient(135deg, rgba(0, 255, 136, 0.08) 0%, rgba(14, 22, 40, 0.9) 100%);
    }

    .status-banner.pending {
      border-color: rgba(255, 183, 3, 0.4);
      background: linear-gradient(135deg, rgba(255, 183, 3, 0.08) 0%, rgba(14, 22, 40, 0.9) 100%);
    }

    .status-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-badge-icon {
      width: 52px;
      height: 52px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-badge-icon.confirmed {
      background: rgba(0, 255, 136, 0.15);
      color: var(--laser-green);
      box-shadow: 0 0 16px var(--laser-green-glow);
    }

    .status-badge-icon.pending {
      background: rgba(255, 183, 3, 0.15);
      color: var(--laser-amber);
      box-shadow: 0 0 16px var(--laser-amber-glow);
    }

    .portal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 26px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-md);
    }

    .portal-package-hero {
      position: relative;
      height: 200px;
      background-size: cover;
      background-position: center;
      border-top-left-radius: var(--radius-xl);
      border-top-right-radius: var(--radius-xl);
      overflow: hidden;
    }

    .portal-package-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(4, 7, 15, 0.15) 0%, rgba(14, 22, 40, 0.85) 65%, var(--bg-card) 100%);
    }

    .portal-package-hero-content {
      position: absolute;
      bottom: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .portal-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }

    .portal-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .detail-item {
      background: var(--bg-surface);
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .detail-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .detail-val {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }

    .finance-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.95rem;
    }

    .finance-row:last-child {
      border-bottom: none;
    }

    .roster-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 650px) {
      .roster-grid {
        grid-template-columns: 1fr;
      }
    }

    .team-box {
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      padding: 18px;
      border: 1px solid var(--border-subtle);
    }

    .team-box.red {
      border-left: 4px solid var(--laser-pink);
    }

    .team-box.blue {
      border-left: 4px solid var(--laser-cyan);
    }

    .team-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-tag-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-medium);
      color: #fff;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      font-size: 0.88rem;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--laser-green);
      color: #04070f;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: var(--radius-full);
      box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
      display: none;
      z-index: 9999;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Portal Header -->
  <header class="portal-nav">
    <div class="brand-wrap">
      <img src="https://cdn.prod.website-files.com/6a5dfddc421d6120331d50f5/6a732659b500bebf3241f2b9_Laser-Magic-Logo.png" alt="Laser Magic" class="brand-logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'140\' height=\'30\'><text x=\'0\' y=\'22\' fill=\'%2300f0ff\' font-weight=\'bold\' font-size=\'18\'>LASER MAGIC</text></svg>'">
      <div>
        <div class="brand-title">Laser Magic</div>
        <div class="brand-sub" id="portal-brand-sub">Espace Confirmation Client</div>
      </div>
    </div>

    <!-- Language Selector -->
    <div class="lang-selector">
      <button type="button" class="lang-btn active" data-lang="fr" title="Français">
        <svg class="flag-icon flag-fr" width="15" height="10" viewBox="0 0 3 2" style="border-radius:2px; flex-shrink:0; display:inline-block; vertical-align:middle; box-shadow:0 0 0 1px rgba(255,255,255,0.2); overflow:hidden;" aria-hidden="true"><rect width="1" height="2" fill="#002654"/><rect x="1" width="1" height="2" fill="#FFFFFF"/><rect x="2" width="1" height="2" fill="#CE1126"/></svg>
        <span>FR</span>
      </button>
      <button type="button" class="lang-btn" data-lang="nl" title="Nederlands">
        <svg class="flag-icon flag-nl" width="15" height="10" viewBox="0 0 3 2" style="border-radius:2px; flex-shrink:0; display:inline-block; vertical-align:middle; box-shadow:0 0 0 1px rgba(255,255,255,0.2); overflow:hidden;" aria-hidden="true"><rect width="3" height="0.67" fill="#AE1C28"/><rect y="0.67" width="3" height="0.66" fill="#FFFFFF"/><rect y="1.33" width="3" height="0.67" fill="#21468B"/></svg>
        <span>NL</span>
      </button>
      <button type="button" class="lang-btn" data-lang="en" title="English">
        <svg class="flag-icon flag-en" width="15" height="10" viewBox="0 0 60 30" style="border-radius:2px; flex-shrink:0; display:inline-block; vertical-align:middle; box-shadow:0 0 0 1px rgba(255,255,255,0.2); overflow:hidden;" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>
        <span>EN</span>
      </button>
    </div>
  </header>

  <main class="portal-container" id="portal-root">
    <!-- Populated by src/confirm.js -->
    <div style="text-align:center; padding:60px; color:var(--text-secondary);">
      Chargement de votre dossier de réservation...
    </div>
  </main>

  <div class="toast-popup" id="portal-toast">
    Réservation confirmée avec succès !
  </div>

  <script type="module">
    import { initConfirmPortal } from './src/confirm.js';
    initConfirmPortal();
  </script>
</body>
</html>
